<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALATAMA SYSTEM BY BENG BECKMAN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap');

        :root {
            --bg-color: #050811;
            --card-bg: rgba(18, 26, 43, 0.85);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-purple: #b5179e;
            --accent-pink: #f72585;
            --accent-yellow: #ffb703;
            --accent-green: #06d6a0;
            --accent-red: #ff0054;
            --text-main: #ffffff;
            --text-muted: #7b8fa7;
            --border-glow: #1e2d4a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(181, 23, 158, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(0, 242, 254, 0.15) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 20px; }

        .marquee-container {
            background: linear-gradient(90deg, rgba(247, 37, 133, 0.2), rgba(0, 242, 254, 0.2));
            border: 1px solid var(--accent-pink);
            border-radius: 8px;
            padding: 6px 12px;
            overflow: hidden;
            white-space: nowrap;
            box-shadow: 0 0 10px rgba(247, 37, 133, 0.3);
        }

        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 18s linear infinite;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--accent-cyan);
            letter-spacing: 1px;
        }

        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        header {
            background: var(--card-bg);
            padding: 20px 28px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2), inset 0 0 15px rgba(0, 242, 254, 0.1);
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .round-badge {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            color: white;
            padding: 6px 18px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            box-shadow: 0 0 15px rgba(247, 37, 133, 0.6);
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        .timer-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--accent-yellow);
            flex-wrap: wrap;
        }

        .timer-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--accent-yellow);
            text-shadow: 0 0 10px var(--accent-yellow);
            min-width: 95px;
            text-align: center;
        }

        .timer-input {
            width: 50px !important;
            padding: 6px !important;
            font-size: 0.9rem !important;
            text-align: center;
            border-radius: 4px !important;
        }

        .btn {
            background: var(--border-glow);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 14px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
        }

        .btn:hover { transform: scale(1.03); box-shadow: 0 0 15px rgba(255, 255, 255, 0.4); }

        .btn-next {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #000;
            font-size: 0.9rem;
            padding: 10px 16px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
            border: none;
        }

        .btn-action-secret { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 12px; font-size: 0.9rem; }
        .btn-action-mutasi { background: rgba(181, 23, 158, 0.2); border: 1px solid var(--accent-purple); color: #ff75c3; padding: 12px; font-size: 0.9rem; }
        .btn-action-boss-polos { background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan)); color: #000; font-size: 0.95rem; padding: 12px; border: none; }
        .btn-action-boss-mutasi { background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple)); color: #fff; font-size: 0.95rem; padding: 12px; border: none; box-shadow: 0 0 15px rgba(247, 37, 133, 0.4); }

        .btn-sponsor { background: linear-gradient(135deg, var(--accent-green), #00b4d8); color: #000; border: none; }
        .btn-reset-sponsor { background: rgba(255, 183, 3, 0.15); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }
        .btn-danger { background: rgba(255, 0, 84, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

        .mode-selector-card {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--accent-cyan);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mode-title { font-family: 'Orbitron', sans-serif; color: var(--accent-cyan); font-size: 0.9rem; letter-spacing: 1px; }

        .mode-switch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

        .btn-mode {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow);
            color: var(--text-muted);
            padding: 10px 12px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .btn-mode.active {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #000;
            font-weight: 900;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
            border-color: var(--accent-cyan);
        }

        .input-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .input-card h2 { font-family: 'Orbitron', sans-serif; font-size: 1rem; margin-bottom: 15px; color: var(--accent-cyan); letter-spacing: 1px; }

        input[type="text"], input[type="number"] {
            width: 100%;
            background: rgba(5, 8, 17, 0.8);
            border: 2px solid var(--border-glow);
            color: white;
            padding: 16px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus, input[type="number"]:focus { border-color: var(--accent-cyan); box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); }

        .action-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 15px; }

        .main-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        @media (max-width: 768px) { .main-layout { grid-template-columns: 1fr; } header { justify-content: center; } }

        .board-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border-glow);
            min-height: 380px;
            backdrop-filter: blur(10px);
        }

        .board-card h2 { font-family: 'Orbitron', sans-serif; font-size: 1rem; margin-bottom: 18px; color: var(--accent-cyan); display: flex; justify-content: space-between; align-items: center; }

        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }

        th { color: var(--text-muted); font-family: 'Orbitron', sans-serif; font-size: 0.75rem; text-transform: uppercase; padding: 8px 12px; }

        td { padding: 12px; background: rgba(255, 255, 255, 0.02); border-top: 1px solid rgba(255, 255, 255, 0.05); border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 1.1rem; font-weight: 700; }

        td:first-child { border-radius: 8px 0 0 8px; border-left: 1px solid rgba(255, 255, 255, 0.05); }
        td:last-child { border-radius: 0 8px 8px 0; border-right: 1px solid rgba(255, 255, 255, 0.05); }

        .badge-status { padding: 4px 12px; border-radius: 4px; font-family: 'Orbitron', sans-serif; font-size: 0.75rem; font-weight: 800; display: inline-block; }
        .status-waiting { background: rgba(255, 183, 3, 0.2); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }
        .status-survive { background: rgba(6, 214, 160, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }

        .rank-number { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 900; color: var(--accent-pink); }

        .control-panel {
            background: var(--card-bg);
            padding: 16px 24px;
            border-radius: 16px;
            border: 1px solid var(--border-glow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .delete-btn { background: none; border: none; color: var(--accent-red); cursor: pointer; font-size: 1.2rem; }

        footer { background: rgba(18, 26, 43, 0.9); border: 1px solid var(--border-glow); border-radius: 16px; padding: 20px; text-align: center; }
        .sponsor-title { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; color: var(--accent-pink); letter-spacing: 3px; margin-bottom: 12px; }
        .sponsor-logos { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .sponsor-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(0, 242, 254, 0.3); padding: 8px 16px; border-radius: 8px; font-family: 'Orbitron', sans-serif; font-size: 0.85rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .delete-sponsor-btn { background: none; border: none; color: var(--accent-red); cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="marquee-container">
        <div class="marquee-text">
            🔥 GALAHAMUY CONTROL CENTER — SIAPKAN STRATEGI, ROD DAN BAIT TERBAIKMU ! 🔥
        </div>
    </div>

    <header>
        <div class="brand">
            <h1>🎮 CONTROL CENTER GALAHAMUY</h1>
        </div>
        
        <div class="round-badge" id="currentRoundDisplay">RONDE 1</div>

        <div class="timer-container">
            <span>⏱️</span>
            <div class="timer-display" id="timerDisplay">15:00</div>
            <input type="number" id="customMinutes" class="timer-input" placeholder="Min" value="15" min="1">
            <button class="btn" onclick="applyCustomTimer()">Set</button>
            <button class="btn" id="startStopBtn" onclick="toggleTimer()">Start</button>
            <button class="btn" onclick="resetTimer()">Reset</button>
        </div>

        <button class="btn btn-next" id="nextRoundBtn" onclick="nextRound()">NEXT RONDE ➔</button>
    </header>

    <div class="mode-selector-card">
        <div class="mode-title">⚙️ PILIH MODE / TEMA EVENT:</div>
        <div class="mode-switch-grid">
            <button class="btn-mode" id="btn-SURVIVAL" onclick="switchMode('SURVIVAL')">🛡️ SURVIVAL</button>
            <button class="btn-mode" id="btn-POIN" onclick="switchMode('POIN')">🎯 GALATAMA POIN</button>
            <button class="btn-mode" id="btn-MEGALODON" onclick="switchMode('MEGALODON')">🦈 MEGALODON</button>
            <button class="btn-mode" id="btn-DARK_MEGALODON" onclick="switchMode('DARK_MEGALODON')">🌑 DARK MEGALODON</button>
            <button class="btn-mode" id="btn-GLACIAL_SERPENT" onclick="switchMode('GLACIAL_SERPENT')">❄️ GLACIAL SERPENT</button>
            <button class="btn-mode" id="btn-THUNDERZILLA" onclick="switchMode('THUNDERZILLA')">⚡ THUNDERZILLA</button>
        </div>
    </div>

    <div class="input-card">
        <h2>INPUT HASIL PESERTA (<span id="inputModeDisplay" style="color: var(--accent-pink);">GALATAMA SURVIVAL</span>)</h2>
        <input type="text" id="inputUsername" placeholder="MASUKKAN USERNAME (@asep)" autocomplete="off">
        
        <div class="action-buttons" id="actionButtonsContainer"></div>
    </div>

    <div class="main-layout">
        <div class="board-card">
            <h2>
                <span id="leftBoardTitle">HASIL RONDE AKTIF</span>
                <span id="activeRoundSub" style="font-size: 0.85rem; color: var(--accent-pink);">RONDE 1</span>
            </h2>
            <table>
                <thead>
                    <tr id="tableHeaderRow"></tr>
                </thead>
                <tbody id="activeRoundTable"></tbody>
            </table>
        </div>

        <div class="board-card">
            <h2>🏆 TOTAL SCOREBOARD</h2>
            <table>
                <thead>
                    <tr>
                        <th style="width: 40px;">#</th>
                        <th>Username</th>
                        <th>Total Point</th>
                    </tr>
                </thead>
                <tbody id="totalScoreTable"></tbody>
            </table>
        </div>
    </div>

    <div class="control-panel">
        <div>
            <button class="btn" onclick="exportData()">💾 Export JSON</button>
            <button class="btn" onclick="document.getElementById('importFile').click()">📂 Import JSON</button>
            <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
            <button class="btn btn-sponsor" onclick="addSponsor()">➕ Tambah Sponsor</button>
            <button class="btn btn-reset-sponsor" onclick="resetSponsorsOnly()">🗑️ Reset Sponsor</button>
        </div>
        <button class="btn btn-danger" onclick="resetMatchDataOnly()">⚠️ Reset Poin & Match Data</button>
    </div>

    <footer>
        <div class="sponsor-title">OFFICIAL SPONSORS & PARTNERS</div>
        <div class="sponsor-logos" id="sponsorContainer"></div>
    </footer>
</div>

<script>
    const MODE_CONFIGS = {
        'SURVIVAL': {
            name: 'GALATAMA SURVIVAL',
            isRoundsMode: true,
            hasStatusCol: true,
            actions: [
                { label: '★ SECRET (+1 PTS)', type: 'SECRET', pts: 1, class: 'btn-action-secret' },
                { label: '◆ MITOS (SURVIVE)', type: 'MITOS', pts: 0, class: 'btn-action-boss-polos' }
            ]
        },
        'POIN': {
            name: 'GALATAMA POIN',
            isRoundsMode: false,
            hasStatusCol: false,
            actions: [
                { label: '★ SECRET (+1 PTS)', type: 'SECRET', pts: 1, class: 'btn-action-secret' },
                { label: '🧬 SECRET MUTASI (+2 PTS)', type: 'SECRET_MUTASI', pts: 2, class: 'btn-action-mutasi' }
            ]
        },
        'MEGALODON': {
            name: 'GALATAMA MEGALODON',
            isRoundsMode: false,
            hasStatusCol: false,
            actions: [
                { label: '★ SECRET (+1 PTS)', type: 'SECRET', pts: 1, class: 'btn-action-secret' },
                { label: '🧬 SECRET MUTASI (+2 PTS)', type: 'SECRET_MUTASI', pts: 2, class: 'btn-action-mutasi' },
                { label: '🦈 MEGALODON POLOS (+4 PTS)', type: 'MEGALODON_POLOS', pts: 4, class: 'btn-action-boss-polos' },
                { label: '🧬 MEGALODON MUTASI (+5 PTS)', type: 'MEGALODON_MUTASI', pts: 5, class: 'btn-action-boss-mutasi' }
            ]
        },
        'DARK_MEGALODON': {
            name: 'DARK MEGALODON',
            isRoundsMode: false,
            hasStatusCol: false,
            actions: [
                { label: '★ SECRET (+1 PTS)', type: 'SECRET', pts: 1, class: 'btn-action-secret' },
                { label: '🧬 SECRET MUTASI (+2 PTS)', type: 'SECRET_MUTASI', pts: 2, class: 'btn-action-mutasi' },
                { label: '🌑 DARK MEGALODON POLOS (+4 PTS)', type: 'DARK_MEGALODON_POLOS', pts: 4, class: 'btn-action-boss-polos' },
                { label: '🧬 DARK MEGALODON MUTASI (+5 PTS)', type: 'DARK_MEGALODON_MUTASI', pts: 5, class: 'btn-action-boss-mutasi' }
            ]
        },
        'GLACIAL_SERPENT': {
            name: 'GLACIAL SERPENT',
            isRoundsMode: false,
            hasStatusCol: false,
            actions: [
                { label: '★ SECRET (+1 PTS)', type: 'SECRET', pts: 1, class: 'btn-action-secret' },
                { label: '🧬 SECRET MUTASI (+2 PTS)', type: 'SECRET_MUTASI', pts: 2, class: 'btn-action-mutasi' },
                { label: '❄️ GLACIAL SERPENT POLOS (+4 PTS)', type: 'GLACIAL_SERPENT_POLOS', pts: 4, class: 'btn-action-boss-polos' },
                { label: '🧬 GLACIAL SERPENT MUTASI (+5 PTS)', type: 'GLACIAL_SERPENT_MUTASI', pts: 5, class: 'btn-action-boss-mutasi' }
            ]
        },
        'THUNDERZILLA': {
            name: 'THUNDERZILLA',
            isRoundsMode: false,
            hasStatusCol: false,
            actions: [
                { label: '★ SECRET (+1 PTS)', type: 'SECRET', pts: 1, class: 'btn-action-secret' },
                { label: '🧬 SECRET MUTASI (+2 PTS)', type: 'SECRET_MUTASI', pts: 2, class: 'btn-action-mutasi' },
                { label: '⚡ THUNDERZILLA (+10 PTS)', type: 'THUNDERZILLA', pts: 10, class: 'btn-action-boss-mutasi' }
            ]
        }
    };

    let appData = {
        currentRound: 1,
        matchMode: 'SURVIVAL',
        players: {}, 
        history: [],
        sponsors: ["SPONSOR 1", "SPONSOR 2"],
        timerDisplay: '15:00',
        timeLeft: 900
    };

    let initialTimeMinutes = 15;
    let timeLeft = initialTimeMinutes * 60;
    let timerInterval = null;

    window.onload = function() {
        loadFromLocalStorage();
        render();
        updateTimerDisplay();
    };

    function saveToLocalStorage() {
        appData.timeLeft = timeLeft;
        localStorage.setItem('warPointTournamentData', JSON.stringify(appData));
    }

    function loadFromLocalStorage() {
        const saved = localStorage.getItem('warPointTournamentData');
        if (saved) {
            try { 
                appData = JSON.parse(saved); 
                if(!appData.sponsors) appData.sponsors = ["SPONSOR 1", "SPONSOR 2"];
                if(!appData.matchMode || !MODE_CONFIGS[appData.matchMode]) appData.matchMode = 'SURVIVAL';
                if(appData.timeLeft !== undefined) timeLeft = appData.timeLeft;
            } catch (e) {}
        }
    }

    function switchMode(newMode) {
        if (MODE_CONFIGS[newMode]) {
            appData.matchMode = newMode;
            saveToLocalStorage();
            render();
        }
    }

    function applyCustomTimer() {
        const val = parseInt(document.getElementById('customMinutes').value);
        if (val && val > 0) {
            initialTimeMinutes = val;
            resetTimer();
        } else {
            alert("Masukkan angka menit yang valid!");
        }
    }

    function updateTimerDisplay() {
        const hours = Math.floor(timeLeft / 3600);
        const minutes = Math.floor((timeLeft % 3600) / 60);
        const seconds = timeLeft % 60;
        
        let timeString = hours > 0 
            ? `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`
            : `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

        document.getElementById('timerDisplay').innerText = timeString;
        appData.timerDisplay = timeString;
        saveToLocalStorage();
    }

    function toggleTimer() {
        const btn = document.getElementById('startStopBtn');
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
            btn.innerText = 'Start';
            btn.style.backgroundColor = 'var(--border-glow)';
            btn.style.color = '#fff';
        } else {
            btn.innerText = 'Pause';
            btn.style.backgroundColor = 'var(--accent-yellow)';
            btn.style.color = '#000';
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    btn.innerText = 'Start';
                    alert("⏱️ Waktu pertandingan telah habis!");
                }
            }, 1000);
        }
    }

    function resetTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        timeLeft = initialTimeMinutes * 60;
        updateTimerDisplay();
        const btn = document.getElementById('startStopBtn');
        btn.innerText = 'Start';
        btn.style.backgroundColor = 'var(--border-glow)';
        btn.style.color = '#fff';
    }

    function formatUsername(input) {
        let cleaned = input.trim();
        if (!cleaned) return null;
        if (!cleaned.startsWith('@')) cleaned = '@' + cleaned;
        return cleaned;
    }

    function submitResult(actionType, points, actionLabel) {
        const userInput = document.getElementById('inputUsername').value;
        const formattedUser = formatUsername(userInput);

        if (!formattedUser) {
            alert("Harap masukkan username!");
            return;
        }

        const userKey = formattedUser.toLowerCase();

        if (!appData.players[userKey]) {
            appData.players[userKey] = { displayName: formattedUser };
        }

        if (appData.matchMode === 'SURVIVAL' && actionType === 'SECRET') {
            const hasSecretInRound = appData.history.some(item => 
                item.mode === 'SURVIVAL' &&
                item.round === appData.currentRound && 
                item.usernameKey === userKey && 
                item.type === 'SECRET'
            );

            if (hasSecretInRound) {
                alert(`⚠️ ${appData.players[userKey].displayName} sudah dapat poin Secret di ronde ini!`);
                return;
            }
        }

        appData.history.push({
            id: Date.now(),
            round: MODE_CONFIGS[appData.matchMode].isRoundsMode ? appData.currentRound : null,
            mode: appData.matchMode,
            usernameKey: userKey,
            type: actionType,
            label: actionLabel,
            points: points
        });

        document.getElementById('inputUsername').value = '';
        saveToLocalStorage();
        render();
    }

    function deleteEntry(id) {
        if (confirm("Hapus data ini?")) {
            appData.history = appData.history.filter(item => item.id !== id);
            saveToLocalStorage();
            render();
        }
    }

    function nextRound() {
        if (confirm(`Lanjut ke RONDE ${appData.currentRound + 1}?`)) {
            appData.currentRound += 1;
            resetTimer();
            saveToLocalStorage();
            render();
        }
    }

    function addSponsor() {
        const name = prompt("Masukkan Nama Sponsor / Partner Baru:");
        if (name && name.trim() !== "") {
            appData.sponsors.push(name.trim().toUpperCase());
            saveToLocalStorage();
            render();
        }
    }

    function deleteSponsor(index) {
        if (confirm(`Hapus sponsor "${appData.sponsors[index]}"?`)) {
            appData.sponsors.splice(index, 1);
            saveToLocalStorage();
            render();
        }
    }

    function resetSponsorsOnly() {
        if (confirm("Hapus SEMUA daftar sponsor saja? (Data pemain & skor tetep AMAN)")) {
            appData.sponsors = [];
            saveToLocalStorage();
            render();
        }
    }

    function resetMatchDataOnly() {
        if (confirm("⚠️ RESET POIN & MATCH? (Semua pemain dan poin dihapus, daftar SPONSOR TETAP AMAN)")) {
            appData.currentRound = 1;
            appData.players = {};
            appData.history = [];
            resetTimer();
            saveToLocalStorage();
            render();
        }
    }

    function render() {
        const currentConfig = MODE_CONFIGS[appData.matchMode];

        const roundBadge = document.getElementById('currentRoundDisplay');
        const nextRoundBtn = document.getElementById('nextRoundBtn');
        const leftTitle = document.getElementById('leftBoardTitle');
        const activeRoundSub = document.getElementById('activeRoundSub');

        if (currentConfig.isRoundsMode) {
            roundBadge.style.display = 'block';
            nextRoundBtn.style.display = 'block';
            activeRoundSub.style.display = 'inline';
            roundBadge.innerText = `RONDE ${appData.currentRound}`;
            activeRoundSub.innerText = `RONDE ${appData.currentRound}`;
            leftTitle.innerText = "HASIL RONDE AKTIF";
        } else {
            roundBadge.style.display = 'none';
            nextRoundBtn.style.display = 'none';
            activeRoundSub.style.display = 'none';
            leftTitle.innerText = `LOG ${currentConfig.name}`;
        }

        document.getElementById('inputModeDisplay').innerText = currentConfig.name;

        Object.keys(MODE_CONFIGS).forEach(mKey => {
            const btn = document.getElementById(`btn-${mKey}`);
            if (btn) {
                if (mKey === appData.matchMode) btn.classList.add('active');
                else btn.classList.remove('active');
            }
        });

        const actionContainer = document.getElementById('actionButtonsContainer');
        actionContainer.innerHTML = '';
        currentConfig.actions.forEach(act => {
            const btn = document.createElement('button');
            btn.className = `btn ${act.class}`;
            btn.innerText = act.label;
            btn.onclick = () => submitResult(act.type, act.pts, act.label);
            actionContainer.appendChild(btn);
        });

        const headerRow = document.getElementById('tableHeaderRow');
        if (currentConfig.hasStatusCol) {
            headerRow.innerHTML = `
                <th>Username</th>
                <th>Hasil</th>
                <th>Status</th>
                <th>Aksi</th>
            `;
        } else {
            headerRow.innerHTML = `
                <th>Username</th>
                <th>Hasil</th>
                <th>Point</th>
                <th>Aksi</th>
            `;
        }

        const activeTable = document.getElementById('activeRoundTable');
        activeTable.innerHTML = '';
        
        let filteredEntries = [];
        if (currentConfig.isRoundsMode) {
            filteredEntries = appData.history.filter(item => item.mode === appData.matchMode && item.round === appData.currentRound);
        } else {
            filteredEntries = appData.history.filter(item => item.mode === appData.matchMode);
        }

        if (filteredEntries.length === 0) {
            activeTable.innerHTML = `<tr><td colspan="4" style="text-align:center; color: var(--text-muted);">Belum ada data tercatat</td></tr>`;
        } else {
            [...filteredEntries].reverse().forEach(entry => {
                const displayName = appData.players[entry.usernameKey]?.displayName || entry.usernameKey;
                
                let colThree = '';
                if (currentConfig.hasStatusCol) {
                    colThree = entry.type === 'SECRET' 
                        ? `<span class="badge-status status-waiting">🏠 WAITING</span>` 
                        : `<span class="badge-status status-survive">🟢 SURVIVE</span>`;
                } else {
                    colThree = `<span style="color: var(--accent-cyan); font-weight: bold;">+${entry.points} PTS</span>`;
                }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${displayName}</strong></td>
                    <td style="color: var(--accent-pink); font-size: 0.9rem;">${entry.label || entry.type}</td>
                    <td>${colThree}</td>
                    <td><button class="delete-btn" onclick="deleteEntry(${entry.id})">✕</button></td>
                `;
                activeTable.appendChild(row);
            });
        }

        const totalTable = document.getElementById('totalScoreTable');
        totalTable.innerHTML = '';
        const totals = {};
        Object.keys(appData.players).forEach(key => totals[key] = 0);

        appData.history.forEach(item => {
            totals[item.usernameKey] = (totals[item.usernameKey] || 0) + item.points;
        });

        const leaderboard = Object.keys(totals).map(key => ({
            usernameKey: key,
            displayName: appData.players[key]?.displayName || key,
            totalPoints: totals[key]
        })).sort((a, b) => b.totalPoints - a.totalPoints);

        if (leaderboard.length === 0) {
            totalTable.innerHTML = `<tr><td colspan="3" style="text-align:center; color: var(--text-muted);">Belum ada skor</td></tr>`;
        } else {
            leaderboard.forEach((player, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="rank-number">${index + 1}</td>
                    <td><strong>${player.displayName}</strong></td>
                    <td><span style="color: var(--accent-cyan); font-weight: 900; font-size: 1.2rem;">${player.totalPoints}</span> PTS</td>
                `;
                totalTable.appendChild(row);
            });
        }

        const sponsorContainer = document.getElementById('sponsorContainer');
        sponsorContainer.innerHTML = '';
        if (appData.sponsors.length === 0) {
            sponsorContainer.innerHTML = `<span style="color: var(--text-muted); font-size: 0.85rem;">Belum ada sponsor.</span>`;
        } else {
            appData.sponsors.forEach((sp, idx) => {
                const card = document.createElement('div');
                card.className = 'sponsor-card';
                card.innerHTML = `
                    <span>⚡ ${sp}</span>
                    <button class="delete-sponsor-btn" onclick="deleteSponsor(${idx})">✕</button>
                `;
                sponsorContainer.appendChild(card);
            });
        }
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `tournament_war_point.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importData(event) {
        const fileReader = new FileReader();
        fileReader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (importedData.players && importedData.history) {
                    appData = importedData;
                    saveToLocalStorage();
                    render();
                    alert("Data Control Centre berhasil diimport!");
                }
            } catch (err) { alert("File JSON tidak valid."); }
        };
        fileReader.readAsText(event.target.files[0]);
    }
</script>

</html>
